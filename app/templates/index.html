<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>PickBook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0b0b0b;
    color:white;
    min-height:100vh;
}

/* =========================================
   HEADER
========================================= */

header{
    padding:30px 20px;
    border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky;
    top:0;
    background:#0b0b0b;
    z-index:100;
}

.topbar{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    font-size:32px;
    font-weight:800;
}

.logo span{
    color:#ffb703;
}

/* =========================================
   CONTROLS
========================================= */

.controls{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.controls input,
.controls select{
    padding:14px 16px;
    border:none;
    border-radius:12px;
    background:#161616;
    color:white;
    min-width:220px;
    outline:none;
    font-size:15px;
}

.controls input::placeholder{
    color:#aaa;
}

/* =========================================
   MAIN
========================================= */

main{
    max-width:1400px;
    margin:auto;
    padding:40px 20px;
}

/* =========================================
   GRID
========================================= */

.books-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:28px;
}

/* =========================================
   CARD
========================================= */

.book-card{
    background:#121212;
    border-radius:22px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.06);
    transition:.25s;
}

.book-card:hover{
    transform:translateY(-5px);
    border-color:rgba(255,255,255,.14);
}

.book-cover-wrapper{
    width:100%;
    aspect-ratio:2/3;
    overflow:hidden;
    background:#1a1a1a;
}

.book-cover{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.book-info{
    padding:18px;
}

.book-genre{
    font-size:12px;
    opacity:.7;
    margin-bottom:10px;
}

.book-title{
    font-size:18px;
    font-weight:700;
    line-height:1.35;
    margin-bottom:10px;
}

.book-author{
    font-size:14px;
    opacity:.8;
    margin-bottom:18px;
}

.read-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:12px;
    border-radius:12px;
    background:#ffb703;
    color:black;
    text-decoration:none;
    font-weight:700;
    transition:.2s;
}

.read-btn:hover{
    opacity:.9;
}

/* =========================================
   PAGINATION
========================================= */

.pagination{
    margin:50px 0 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
}

.pagination button{
    padding:12px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#ffb703;
    color:black;
    font-weight:700;
    transition:.2s;
}

.pagination button:hover{
    opacity:.9;
}

.pagination button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.pagination span{
    opacity:.8;
}

/* =========================================
   EMPTY
========================================= */

.empty-state{
    text-align:center;
    padding:80px 20px;
    opacity:.7;
    font-size:18px;
}

/* =========================================
   LOADER
========================================= */

.loader{
    text-align:center;
    padding:100px 20px;
    font-size:18px;
    opacity:.7;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:768px){

    .topbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .controls{
        width:100%;
    }

    .controls input,
    .controls select{
        width:100%;
    }

}

</style>
</head>

<body>

<header>

    <div class="topbar">

        <div class="logo">
            Pick<span>Book</span>
        </div>

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search books..."
            />

            <select id="genreSelect">
                <option value="All">All Genres</option>
            </select>

        </div>

    </div>

</header>

<main>

    <div id="books-grid" class="books-grid">

        <div class="loader">
            Loading books...
        </div>

    </div>

    <div id="pagination" class="pagination"></div>

</main>

<script>

// =========================================
// CONFIG
// =========================================

const API_BASE = "";

// =========================================
// STATE
// =========================================

let ALL_BOOKS = [];
let FILTERED_BOOKS = [];

let CURRENT_PAGE = 1;

const BOOKS_PER_PAGE = 30;

// =========================================
// FETCH BOOKS
// =========================================

async function loadBooks() {

    try {

        const response = await fetch(`${API_BASE}/ingest/books`);

        if (!response.ok) {
            throw new Error("Failed to fetch books");
        }

        ALL_BOOKS = await response.json();

        FILTERED_BOOKS = [...ALL_BOOKS];

        populateGenres();

        renderBooks();

        renderPagination();

    } catch (error) {

        console.error(error);

        document.getElementById("books-grid").innerHTML = `
            <div class="empty-state">
                Failed to load books.
            </div>
        `;
    }
}

// =========================================
// POPULATE GENRES
// =========================================

function populateGenres() {

    const genres = [...new Set(
        ALL_BOOKS
            .map(book => book.genre)
            .filter(Boolean)
    )].sort();

    const select = document.getElementById("genreSelect");

    select.innerHTML = `
        <option value="All">All Genres</option>
    `;

    genres.forEach(genre => {

        select.innerHTML += `
            <option value="${genre}">
                ${genre}
            </option>
        `;
    });
}

// =========================================
// FILTERS
// =========================================

function applyFilters() {

    const search = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const genre = document
        .getElementById("genreSelect")
        .value;

    FILTERED_BOOKS = ALL_BOOKS.filter(book => {

        const matchesSearch =

            !search ||

            book.title?.toLowerCase().includes(search) ||

            book.author?.toLowerCase().includes(search);

        const matchesGenre =

            genre === "All" ||

            !genre ||

            book.genre === genre;

        return matchesSearch && matchesGenre;

    });

    CURRENT_PAGE = 1;

    renderBooks();

    renderPagination();
}

// =========================================
// PAGINATION
// =========================================

function getPaginatedBooks() {

    const start = (CURRENT_PAGE - 1) * BOOKS_PER_PAGE;

    const end = start + BOOKS_PER_PAGE;

    return FILTERED_BOOKS.slice(start, end);
}

function renderPagination() {

    const totalPages = Math.ceil(
        FILTERED_BOOKS.length / BOOKS_PER_PAGE
    );

    const pagination = document.getElementById("pagination");

    if (totalPages <= 1) {

        pagination.innerHTML = "";

        return;
    }

    pagination.innerHTML = `

        <button
            onclick="changePage(${CURRENT_PAGE - 1})"
            ${CURRENT_PAGE === 1 ? "disabled" : ""}
        >
            Previous
        </button>

        <span>
            Page ${CURRENT_PAGE} of ${totalPages}
        </span>

        <button
            onclick="changePage(${CURRENT_PAGE + 1})"
            ${CURRENT_PAGE === totalPages ? "disabled" : ""}
        >
            Next
        </button>

    `;
}

function changePage(page) {

    const totalPages = Math.ceil(
        FILTERED_BOOKS.length / BOOKS_PER_PAGE
    );

    if (page < 1 || page > totalPages) return;

    CURRENT_PAGE = page;

    renderBooks();

    renderPagination();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

// =========================================
// RENDER BOOKS
// =========================================

function renderBooks() {

    const container = document.getElementById("books-grid");

    const books = getPaginatedBooks();

    if (!books.length) {

        container.innerHTML = `
            <div class="empty-state">
                No books found.
            </div>
        `;

        return;
    }

    container.innerHTML = books.map(book => {

        const cover =

            book.cover &&

            book.cover !== "None"

                ? book.cover

                : "https://placehold.co/400x600?text=No+Cover";

        return `

            <div class="book-card">

                <div class="book-cover-wrapper">

                    <img
                        src="${cover}"
                        alt="${book.title}"
                        class="book-cover"
                        loading="lazy"
                        onerror="this.src='https://placehold.co/400x600?text=No+Cover'"
                    />

                </div>

                <div class="book-info">

                    <div class="book-genre">
                        ${book.genre || "Unknown"}
                    </div>

                    <div class="book-title">
                        ${book.title}
                    </div>

                    <div class="book-author">
                        ${book.author || "Unknown Author"}
                    </div>

                    <a
                        href="${book.download}"
                        target="_blank"
                        class="read-btn"
                    >
                        Read Now
                    </a>

                </div>

            </div>

        `;

    }).join("");
}

// =========================================
// EVENTS
// =========================================

document
    .getElementById("searchInput")
    .addEventListener("input", applyFilters);

document
    .getElementById("genreSelect")
    .addEventListener("change", applyFilters);

// =========================================
// START
// =========================================

loadBooks();

</script>

</body>
</html>
