<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>PickBook — Free Novel Reading</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b1120;
  color:white;
  font-family:'Inter',sans-serif;
}

/* =========================
HEADER
========================= */

header{
  padding:24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:0;
  z-index:100;
  background:#0b1120;
}

.logo{
  font-size:2rem;
  font-family:'Playfair Display',serif;
  font-weight:700;
}

.logo span{
  color:#3b82f6;
}

.search-box{
  width:320px;
  max-width:100%;
}

.search-box input{
  width:100%;
  padding:14px 18px;
  border:none;
  border-radius:14px;
  background:#111827;
  color:white;
  outline:none;
  font-size:15px;
}

/* =========================
HERO
========================= */

.hero{
  padding:80px 20px 40px;
  text-align:center;
}

.hero h1{
  font-size:4rem;
  margin-bottom:20px;
  font-family:'Playfair Display',serif;
}

.hero p{
  max-width:700px;
  margin:auto;
  opacity:.8;
  line-height:1.8;
  font-size:1.1rem;
}

/* =========================
FILTERS
========================= */

.filters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin-top:35px;
}

.filter-btn{
  padding:12px 18px;
  border:none;
  border-radius:999px;
  background:#111827;
  color:white;
  cursor:pointer;
  transition:.25s;
  font-weight:600;
}

.filter-btn:hover{
  background:#2563eb;
}

.filter-btn.active{
  background:#2563eb;
}

/* =========================
BOOKS
========================= */

.books-section{
  max-width:1500px;
  margin:auto;
  padding:40px 20px 80px;
}

.section-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
  flex-wrap:wrap;
  gap:10px;
}

.section-top h2{
  font-size:2rem;
}

#resultsCount{
  opacity:.7;
}

.books-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:24px;
}

/* =========================
BOOK CARD
========================= */

.book-card{
  background:#111827;
  border-radius:20px;
  overflow:hidden;
  transition:.25s ease;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.05);
}

.book-card:hover{
  transform:translateY(-6px);
}

.book-cover{
  width:100%;
  height:320px;
  object-fit:cover;
  background:#1f2937;
}

.book-info{
  padding:16px;
}

.book-title{
  font-size:1rem;
  font-weight:700;
  line-height:1.5;
  margin-bottom:8px;
}

.book-author{
  opacity:.7;
  margin-bottom:12px;
  font-size:.92rem;
}

.book-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.book-genre{
  padding:6px 10px;
  border-radius:999px;
  background:#2563eb;
  font-size:.8rem;
}

.book-source{
  font-size:.75rem;
  opacity:.6;
  text-transform:uppercase;
}

/* =========================
PAGINATION
========================= */

.pagination{
  margin-top:50px;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.pagination button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-weight:600;
}

.pagination button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.page-numbers{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.page-number{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-weight:700;
}

.page-number.active{
  background:#2563eb;
}

/* =========================
FOOTER
========================= */

footer{
  padding:40px 20px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.08);
  opacity:.6;
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:768px){

  .hero h1{
    font-size:2.8rem;
  }

  .books-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .book-cover{
    height:250px;
  }
}

@media(max-width:480px){

  header{
    flex-direction:column;
    gap:18px;
  }

  .books-grid{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:2.2rem;
  }
}

</style>
</head>

<body>

<!-- =========================
HEADER
========================= -->

<header>

  <div class="logo">
    Pick<span>Book</span>
  </div>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Search novels, authors, genres..."
    >
  </div>

</header>

<!-- =========================
HERO
========================= -->

<section class="hero">

  <h1>Discover Your Next Story</h1>

  <p>
    Read thousands of free novels, romance stories, fantasy adventures,
    thrillers, mysteries and more from across the internet.
  </p>

  <div class="filters">

    <button class="filter-btn active" data-genre="all">
      All
    </button>

    <button class="filter-btn" data-genre="Romance">
      Romance
    </button>

    <button class="filter-btn" data-genre="Fantasy">
      Fantasy
    </button>

    <button class="filter-btn" data-genre="Thriller">
      Thriller
    </button>

    <button class="filter-btn" data-genre="Science Fiction">
      Sci-Fi
    </button>

    <button class="filter-btn" data-genre="Horror">
      Horror
    </button>

    <button class="filter-btn" data-genre="Young Adult">
      Young Adult
    </button>

  </div>

</section>

<!-- =========================
BOOKS
========================= -->

<section class="books-section">

  <div class="section-top">
    <h2>Stories</h2>
    <p id="resultsCount">Loading books...</p>
  </div>

  <div id="booksGrid" class="books-grid"></div>

  <!-- PAGINATION -->

  <div class="pagination">

    <button id="prevBtn">
      ← Previous
    </button>

    <div id="pageNumbers" class="page-numbers"></div>

    <button id="nextBtn">
      Next →
    </button>

  </div>

</section>

<!-- =========================
FOOTER
========================= -->

<footer>
  © 2026 PickBook — Read Unlimited Stories
</footer>

<script>

/* =========================
CONFIG
========================= */

const API_URL = "/ingest/books";
const BOOKS_PER_PAGE = 30;

let allBooks = [];
let filteredBooks = [];

let currentPage = 1;
let currentGenre = "all";

/* =========================
FETCH BOOKS
========================= */

async function fetchBooks(){

  try{

    const res = await fetch(API_URL);

    const data = await res.json();

    allBooks = data || [];

    filteredBooks = [...allBooks];

    renderPage(1);

  }catch(err){

    console.error(err);

    document.getElementById("booksGrid").innerHTML = `
      <p>Failed to load books.</p>
    `;
  }
}

/* =========================
RENDER PAGE
========================= */

function renderPage(page){

  currentPage = page;

  const start = (page - 1) * BOOKS_PER_PAGE;
  const end = start + BOOKS_PER_PAGE;

  const books = filteredBooks.slice(start,end);

  const grid = document.getElementById("booksGrid");

  grid.innerHTML = "";

  books.forEach(book => {

    const cover =
      book.cover && book.cover !== "null"
        ? book.cover
        : "https://placehold.co/400x600?text=No+Cover";

    const card = document.createElement("div");

    card.className = "book-card";

    card.innerHTML = `
      <img
        src="${cover}"
        class="book-cover"
        loading="lazy"
        alt="${book.title}"
        onerror="this.src='https://placehold.co/400x600?text=No+Cover'"
      >

      <div class="book-info">

        <div class="book-title">
          ${book.title}
        </div>

        <div class="book-author">
          ${book.author || "Unknown Author"}
        </div>

        <div class="book-bottom">

          <div class="book-genre">
            ${book.genre || "Unknown"}
          </div>

          <div class="book-source">
            ${book.source}
          </div>

        </div>

      </div>
    `;

    card.addEventListener("click", () => {
      window.open(book.download, "_blank");
    });

    grid.appendChild(card);

  });

  updatePagination();
  updateResultsCount();
}

/* =========================
RESULTS COUNT
========================= */

function updateResultsCount(){

  const total = filteredBooks.length;

  let start = ((currentPage - 1) * BOOKS_PER_PAGE) + 1;
  let end = currentPage * BOOKS_PER_PAGE;

  if(end > total) end = total;

  if(total === 0){
    start = 0;
  }

  document.getElementById("resultsCount").innerText =
    `Showing ${start}-${end} of ${total} stories`;
}

/* =========================
PAGINATION
========================= */

function updatePagination(){

  const totalPages =
    Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);

  const pageNumbers =
    document.getElementById("pageNumbers");

  pageNumbers.innerHTML = "";

  for(let i = 1; i <= totalPages; i++){

    if(
      i === 1 ||
      i === totalPages ||
      (i >= currentPage - 2 && i <= currentPage + 2)
    ){

      const btn = document.createElement("div");

      btn.className = "page-number";

      if(i === currentPage){
        btn.classList.add("active");
      }

      btn.innerText = i;

      btn.onclick = () => renderPage(i);

      pageNumbers.appendChild(btn);
    }
  }

  document.getElementById("prevBtn").disabled =
    currentPage === 1;

  document.getElementById("nextBtn").disabled =
    currentPage === totalPages || totalPages === 0;
}

/* =========================
BUTTONS
========================= */

document.getElementById("prevBtn")
.addEventListener("click", () => {

  if(currentPage > 1){
    renderPage(currentPage - 1);
  }
});

document.getElementById("nextBtn")
.addEventListener("click", () => {

  const totalPages =
    Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);

  if(currentPage < totalPages){
    renderPage(currentPage + 1);
  }
});

/* =========================
SEARCH
========================= */

document.getElementById("searchInput")
.addEventListener("input", e => {

  const term = e.target.value.toLowerCase();

  filteredBooks = allBooks.filter(book => {

    const matchesGenre =
      currentGenre === "all" ||
      (book.genre || "")
      .toLowerCase()
      .includes(currentGenre.toLowerCase());

    const matchesSearch =

      (book.title || "")
      .toLowerCase()
      .includes(term)

      ||

      (book.author || "")
      .toLowerCase()
      .includes(term)

      ||

      (book.genre || "")
      .toLowerCase()
      .includes(term);

    return matchesGenre && matchesSearch;

  });

  renderPage(1);

});

/* =========================
FILTERS
========================= */

document.querySelectorAll(".filter-btn")
.forEach(btn => {

  btn.addEventListener("click", () => {

    document.querySelectorAll(".filter-btn")
    .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    currentGenre = btn.dataset.genre;

    const search =
      document.getElementById("searchInput")
      .value
      .toLowerCase();

    filteredBooks = allBooks.filter(book => {

      const matchesGenre =
        currentGenre === "all" ||
        (book.genre || "")
        .toLowerCase()
        .includes(currentGenre.toLowerCase());

      const matchesSearch =

        (book.title || "")
        .toLowerCase()
        .includes(search)

        ||

        (book.author || "")
        .toLowerCase()
        .includes(search)

        ||

        (book.genre || "")
        .toLowerCase()
        .includes(search);

      return matchesGenre && matchesSearch;

    });

    renderPage(1);

  });

});

/* =========================
START
========================= */

fetchBooks();

</script>

</body>
</html>
